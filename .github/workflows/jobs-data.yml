# Keeps the Auto care jobs page (jobs/) current: Job Bank wages and outlooks, COPS projections and 2021 Census figures for every province
# (tools/trades_build.py -> jobs/data.json), plus Ontario's labour market job profiles (tools/jobs_build.py -> jobs/ontario.json).
# Runs monthly, on demand, and when this changes.
name: Auto care jobs data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jobs-data.yml', 'tools/jobs_build.py', 'tools/trades_build.py']
  workflow_dispatch:
  schedule:
    - cron: '23 11 7 * *'
permissions:
  contents: write
concurrency: { group: data-commits, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q openpyxl
      - name: Build jobs/data.json (every province)
        run: python3 tools/trades_build.py jobs/data.json
      - name: Build jobs/ontario.json (Ontario detail)
        run: python3 tools/jobs_build.py jobs/ontario.json
      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -N jobs/data.json jobs/ontario.json
          if git diff --quiet -- jobs/data.json jobs/ontario.json; then echo "No change"; exit 0; fi
          git add jobs/data.json jobs/ontario.json && git commit -m "Update auto care jobs data" && git pull --rebase && git push
