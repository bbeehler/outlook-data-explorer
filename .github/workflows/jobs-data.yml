# Keeps the Auto care jobs in Ontario page (jobs/) current from the Government of Ontario's labour market information job profiles
# (the open JSON feed behind https://www.services.labour.gov.on.ca/labourmarket-ui/jobProfile). Runs monthly, on demand, and when this changes.
name: Ontario jobs data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jobs-data.yml', 'tools/jobs_build.py']
  workflow_dispatch:
  schedule:
    - cron: '23 11 7 * *'
permissions:
  contents: write
concurrency: { group: data-commits, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build jobs/data.json
        run: python3 tools/jobs_build.py jobs/data.json
      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -N jobs/data.json
          if git diff --quiet -- jobs/data.json; then echo "No change"; exit 0; fi
          git add jobs/data.json && git commit -m "Update Ontario jobs data" && git pull --rebase && git push
