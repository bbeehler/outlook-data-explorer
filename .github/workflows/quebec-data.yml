# Keeps the Quebec vehicles page (quebec/) current from the SAAQ's open "Véhicules en circulation" files
# (Données Québec, CC BY 4.0). Each file is ~850 MB, so they are read as a stream and never stored.
# Runs monthly (the SAAQ adds a year about once a year), on demand, and when this file or the build script changes.
name: Quebec vehicle data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quebec-data.yml', 'tools/quebec_build.py']
  workflow_dispatch:
  schedule:
    - cron: '17 11 6 * *'
permissions:
  contents: write
concurrency: { group: data-commits, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build quebec/data.json
        run: |
          ARGS=$(python3 - <<'PY'
          import json, urllib.request, re
          j = json.load(urllib.request.urlopen(urllib.request.Request("https://www.donneesquebec.ca/recherche/api/3/action/package_show?id=vehicules-en-circulation", headers={"User-Agent": "Mozilla/5.0"}), timeout=120))["result"]
          out = []
          for r in j["resources"]:
              m = re.search(r"(20\d\d)", r.get("name", "")) 
              if m and str(r.get("format", "")).upper() == "CSV":
                  out.append(f"{m.group(1)}={r['url']}")
          print(" ".join(sorted(out)))
          PY
          )
          echo "$ARGS"
          python3 tools/quebec_build.py $ARGS --out=quebec/data.json
      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -N quebec/data.json || true
          if git diff --quiet -- quebec/data.json; then echo "No change"; exit 0; fi
          git add quebec/data.json && git commit -m "Update Quebec vehicle data" && git pull --rebase && git push
