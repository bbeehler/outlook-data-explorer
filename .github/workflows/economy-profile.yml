# Helper: finds Statistics Canada tables and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Find and describe tables
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import json, urllib.request, re
          W = "https://www150.statcan.gc.ca/t1/wds/rest/"
          def get(path): return json.load(urllib.request.urlopen(W + path, timeout=180))
          def post(path, body):
              req = urllib.request.Request(W + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=180))
          cubes = get("getAllCubesListLite")
          keep = []
          for c in cubes:
              t = (c.get("cubeTitleEn") or "")
              if re.search(r"census metropolitan|metropolitan area|census agglomeration", t, re.I) or (re.search(r"census profile|2021 census", t, re.I)):
                  keep.append(f"{c['productId']} | {t} | {c.get('cubeStartDate')} to {c.get('cubeEndDate')} | {'archived' if c.get('archived')=='1' else ''}")
          open("city_tables.txt", "w").write("\n".join(sorted(keep)))
          summary = []
          for pid in [17100148, 17100135, 14100459, 14100380, 14100294, 14100385]:
              try:
                  m = post("getCubeMetadata", [{"productId": pid}])[0]["object"]
                  json.dump(m, open(f"{pid}.json", "w"))
                  summary.append(f"## {pid} {m.get('cubeTitleEn')} | freq {m.get('frequencyCode')} | {m.get('cubeStartDate')} to {m.get('cubeEndDate')}")
                  for d in m.get("dimension", []):
                      mem = d.get("member", [])
                      summary.append(f"  dim {d['dimensionPositionId']} {d['dimensionNameEn']} ({len(mem)} members)")
                      for x in mem[:80]: summary.append(f"    {x['memberId']} {x['memberNameEn']}")
              except Exception as e:
                  summary.append(f"## {pid} ERROR {e}")
          open("summary.txt", "w").write("\n".join(summary))
          PY
          wc -l city_tables.txt; head -c 2000 summary.txt
      - name: Save
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
