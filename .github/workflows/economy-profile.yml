# One-off helper: saves the structure (dimensions and members) of the Statistics Canada tables the Research Hub
# might use, so the economy data can be wired to the right series. Output goes to the `economy-raw` branch.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch table metadata
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import json, urllib.request
          pids = [18100004, 20100001, 20100021, 20100024, 20100025, 20100056, 14100201, 14100203, 36100434, 23100308, 17100009, 14100287, 20100008]
          def post(path, body):
              req = urllib.request.Request("https://www150.statcan.gc.ca/t1/wds/rest/" + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=120))
          summary = []
          for pid in pids:
              try:
                  m = post("getCubeMetadata", [{"productId": pid}])[0]
                  json.dump(m, open(f"{pid}.json", "w"), indent=1)
                  o = m.get("object", {})
                  summary.append(f"## {pid} {o.get('cubeTitleEn')} | freq {o.get('frequencyCode')} | {o.get('cubeStartDate')} to {o.get('cubeEndDate')}")
                  for d in o.get("dimension", []):
                      mem = d.get("member", [])
                      summary.append(f"  dim {d['dimensionPositionId']} {d['dimensionNameEn']} ({len(mem)} members)")
                      for x in mem[:400]:
                          summary.append(f"    {x['memberId']} {x['memberNameEn']}" + (f" (parent {x['parentMemberId']})" if x.get('parentMemberId') else ""))
              except Exception as e:
                  summary.append(f"## {pid} ERROR {e}")
          open("summary.txt", "w").write("\n".join(summary))
          PY
          for s in V39079 FXUSDCAD V80691311; do curl -fsS "https://www.bankofcanada.ca/valet/observations/$s/json?recent=3" -o "boc_$s.json" || echo "fail $s"; done
          ls -la; head -c 3000 summary.txt
      - name: Save to economy-raw branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table profile $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
