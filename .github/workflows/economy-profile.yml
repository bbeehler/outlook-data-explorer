# Helper: profiles Statistics Canada tables (and provincial open-data catalogues) and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Find and describe tables
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B=https://www.services.labour.gov.on.ca/labourmarket
          for n in 72411 72410 72401 73200 72420; do
            curl -s -A "$UA" -H "Accept: application/json" "$B/api/jobProfile/$n" -o jp_$n.json; echo "$n $(wc -c < jp_$n.json) $(head -c 80 jp_$n.json)" >> api.txt; done
          python3 -c "import json;d=json.load(open('jp_72411.json'));json.dump(d,open('jp_72411_pretty.json','w'),indent=1)" 2>>api.txt
          for f in Apprenticeship AssociatedImportantLicensingBodies ComponentsOfJobGrowthGroup ComponentsOfJobGrowthNOC EmploymentCharacteristicsNOC EmploymentGrowthGroup EmploymentGrowthNOCLFS EmploymentIncome EmploymentLevelByEconomicRegion MainIndustries Mapping JobOutlooks; do
            curl -sL -A "$UA" "$B/downloadFiles/$f.csv" -o $f.csv
            { echo "== $f.csv $(wc -c < $f.csv) bytes, $(wc -l < $f.csv) lines"; head -3 $f.csv; grep -E '(^|[^0-9])7241[01]?([^0-9]|$)|(^|[^0-9])7321([^0-9]|$)' $f.csv | head -40; } >> csvs.txt
          done
          rm -f *.csv; ls -la > listing.txt; exit 0
      - name: Save
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
