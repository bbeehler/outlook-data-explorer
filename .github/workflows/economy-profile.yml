# Helper: profiles Statistics Canada tables (and provincial open-data catalogues) and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Find and describe tables
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          python3 - <<'PY' 2>&1 | tee py.log
          import json, urllib.request, csv, io, re
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"}
          def get(u, n=None):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=300)
              return r.read(n) if n else r.read()
          out = []
          for ds in ["1dc7cdcd-5a1c-450a-9544-2a98a3011d61", "adad580f-76b0-4502-bd05-20c125de9116", "b0e112e9-cf53-4e79-8838-23cd98debe5b"]:
              try:
                  j = json.loads(get(f"https://open.canada.ca/data/api/action/package_show?id={ds}"))["result"]
                  out.append(f"## {ds} {j['title']} | modified {j.get('metadata_modified')}")
                  for r in j["resources"]:
                      out.append(f"  {r.get('name')} | {r.get('format')} | {r.get('language')} | {r.get('last_modified') or r.get('created')} | {r.get('url')}")
                      if str(r.get("format")).upper() == "CSV" and ("en" in str(r.get("language")) or "Eng" in str(r.get("name")) or "EN" in str(r.get("url"))):
                          try:
                              raw = get(r["url"])
                              txt = raw.decode("utf-8-sig", "replace") if raw[:3] == b"\xef\xbb\xbf" or True else raw.decode("latin-1")
                              lines = txt.splitlines()
                              out.append(f"    {len(raw)} bytes, {len(lines)} lines")
                              out += ["    " + l[:400] for l in lines[:3]]
                              out += ["    " + l[:400] for l in lines if re.search(r"\b(7241[01]|74203|7321|7322)\b", l)][:40]
                          except Exception as e:
                              out.append(f"    ERROR {e}")
              except Exception as e:
                  out.append(f"## {ds} ERROR {e}")
          # national projections (COPS) and other candidates
          try:
              j = json.loads(get("https://open.canada.ca/data/api/action/package_search?q=Canadian%20Occupational%20Projection%20System%202024&rows=5"))
              for p in j["result"]["results"]:
                  out.append(f"## COPS? {p['id']} {p['title']}")
                  for r in p["resources"][:30]: out.append(f"  {r.get('name')} | {r.get('format')} | {r.get('language')} | {r.get('url')}")
          except Exception as e:
              out.append(f"COPS ERROR {e}")
          open("summary.txt", "w").write("\n".join(out))
          PY
          ls -la > listing.txt; exit 0
      - name: Save
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
