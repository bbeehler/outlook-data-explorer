# Helper: profiles Statistics Canada tables (and provincial open-data catalogues) and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Find and describe tables
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B=https://www.services.labour.gov.on.ca
          # Ontario labour market: the new job profile app, its scripts, and the API paths they call
          curl -sL -A "$UA" "$B/labourmarket-ui/jobProfile?nocCode=72411" -o ui.html; cat ui.html > ui_html.txt
          for s in $(grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' ui.html | sed -E 's/^(src|href)="//; s/"$//'); do
            case "$s" in http*) u="$s";; /*) u="$B$s";; *) u="$B/labourmarket-ui/$s";; esac
            n=$(basename "${s%%\?*}"); curl -sL -A "$UA" "$u" -o "js_$n"; echo "$u $(wc -c < js_$n)" >> scripts.txt
          done
          cat js_* 2>/dev/null | grep -oE '["'"'"'`][^"'"'"'` ]*(api|labourmarket|rest|json|nocCode|jobProfile|download)[^"'"'"'` ]*["'"'"'`]' | sort -u > api_strings.txt
          # the bulk download files
          curl -sL -A "$UA" "$B/labourmarket/downloadFiles/" -o dl_index.html
          curl -sL -A "$UA" "$B/labourmarket/downloadFiles/Data_Dictionary_EN.txt" -o dict.txt
          curl -sL -A "$UA" "$B/labourmarket/jobProfile/jobProfileFullView.xhtml?nocCode=72411" -o old_profile.html
          grep -oE 'href="[^"]*(download|\.csv|\.xlsx|\.txt|\.zip)[^"]*"' ui.html old_profile.html dl_index.html | sort -u > links.txt
          # try likely API routes
          for path in labourmarket-api/jobProfile/72411 labourmarket-api/api/jobProfile/72411 labourmarket-api/jobProfile?nocCode=72411 labourmarket-ws/jobProfile/72411 labourmarket-ui/api/jobProfile/72411 labourmarket-api/v1/jobProfile/72411; do
            c=$(curl -s -A "$UA" -o /dev/null -w "%{http_code} %{content_type}" "$B/$path"); echo "$path $c" >> tries.txt; done
          # test every API-looking string found in the scripts
          grep -oE '/[A-Za-z0-9_/-]*(api|ws|rest)[A-Za-z0-9_/{}.-]*' api_strings.txt | sort -u | head -60 > api_paths.txt
          while read p; do q=$(echo "$p" | sed 's/{[^}]*}/72411/g'); c=$(curl -s -A "$UA" -o "resp_$(echo $q | tr '/?=&' '____').json" -w "%{http_code} %{content_type} %{size_download}" "$B$q?nocCode=72411"); echo "$q $c" >> tries.txt; done < api_paths.txt
          ls -la > listing.txt; exit 0
      - name: Save
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
