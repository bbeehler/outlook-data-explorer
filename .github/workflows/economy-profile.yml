# Helper: profiles Statistics Canada tables (and provincial open-data catalogues) and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Find and describe tables
        run: |
          set +e
          pip install -q openpyxl >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          python3 - <<'PY' 2>&1 | tee py.log
          import json, urllib.request, re, io
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Content-Type": "application/json", "Accept": "application/json"}
          def get(u, body=None):
              return urllib.request.urlopen(urllib.request.Request(u, data=body, headers=UA), timeout=300).read()
          out = []
          AUTO = re.compile(r"(7241[01]|74203|72401|72410)")
          C = "https://open.canada.ca/data/dataset/e80851b8-de68-43bd-a85c-c72e1b3a3890/resource/"
          for name, u in [("summary", C + "7c4767a5-f807-441d-9776-a0074b5870a0/download/summary_sommaire_2026_2035.csv"),
                          ("flmc", C + "446fe474-96e7-47cd-a3f9-3bb391b2df60/download/flmc_cfmt_2026_2035.csv"),
                          ("rlmc", C + "ff795791-0728-4dcf-8fdd-d7ba9e1210b8/download/rlmc_crmt_2023_2025.csv"),
                          ("employment", C + "da1135c5-a1df-4a07-a81e-de308ae6cce6/download/employment_emploi_2026_2035.csv"),
                          ("structure", C + "033499af-369b-45d4-af2f-5327f4e9e18a/download/files_structure_definitions_definition_structure_fichiers_2026_2035.txt")]:
              try:
                  raw = get(u); txt = raw.decode("utf-8-sig", "replace"); L = txt.splitlines()
                  out.append(f"## COPS {name} {len(raw)} bytes {len(L)} lines")
                  out += ["  " + l[:500] for l in (L[:3] if name != "structure" else L[:120])]
                  out += ["  " + l[:500] for l in L if AUTO.search(l)][:12]
                  out += ["  " + l[:300] for l in L if "7241" in l or "Automotive" in l][:6]
              except Exception as e:
                  out.append(f"## COPS {name} ERROR {e}")
          # 2025-2027 outlooks (xlsx)
          try:
              import openpyxl
              raw = get("https://open.canada.ca/data/dataset/b0e112e9-cf53-4e79-8838-23cd98debe5b/resource/cb52e1d0-ab62-4357-91cc-d8f5a2114e02/download/20252027_outlook_n21_en_251208.xlsx")
              wb = openpyxl.load_workbook(io.BytesIO(raw), read_only=True)
              for ws in wb.worksheets:
                  rows = list(ws.iter_rows(values_only=True))
                  out.append(f"## OUTLOOK sheet {ws.title} {len(rows)} rows")
                  out += ["  " + str(r)[:600] for r in rows[:3]]
                  out += ["  " + str(r)[:900] for r in rows if any(AUTO.search(str(c or "")) for c in r[:3])][:30]
          except Exception as e:
              out.append(f"## OUTLOOK ERROR {e}")
          # Census: occupation by province with age, gender, education, labour force status
          W = "https://www150.statcan.gc.ca/t1/wds/rest/"
          for pid in [98100449, 98100593, 98100412]:
              try:
                  m = json.loads(get(W + "getCubeMetadata", json.dumps([{"productId": pid}]).encode()))[0]["object"]
                  out.append(f"## STATCAN {pid} {m.get('cubeTitleEn')}")
                  for d in m["dimension"]:
                      mem = d["member"]
                      out.append(f"  dim {d['dimensionPositionId']} {d['dimensionNameEn']} ({len(mem)})")
                      sel = mem[:25] if len(mem) < 60 else [x for x in mem if AUTO.search(x["memberNameEn"])] + mem[:5]
                      out += [f"    {x['memberId']} {x['memberNameEn']} (parent {x.get('parentMemberId')})" for x in sel]
              except Exception as e:
                  out.append(f"## STATCAN {pid} ERROR {e}")
          open("summary.txt", "w").write("\n".join(out))
          PY
          ls -la > listing.txt; exit 0
      - name: Save
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
