# Helper: profiles Statistics Canada tables (and provincial open-data catalogues) and saves their structure to the `economy-raw` branch, so new economy
# series can be wired to the right table and members. Run on demand (Actions tab) or when this file changes.
name: Economy table profile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/economy-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Find and describe tables
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B=https://www.services.labour.gov.on.ca
          curl -s -A "$UA" "$B/labourmarket-ui/assets/i18n/en.json" -o en.json
          for n in 72410 72411 74203 72401 72402 72422 62020 64100 64101 72400 73402 22312 72106 75101; do
            curl -s -A "$UA" -H "Accept: application/json" "$B/labourmarket/api/jobProfile/$n" | python3 -c "import json,sys
          try:
              d=json.load(sys.stdin); w=d['nocWrapper']; print('$n', w['nocEnTitle'], '| outlook', w['jobOutlook']['jobOutlookCode'], '| openings', d.get('openingCategoryFormatted'))
          except Exception as e: print('$n ERR', e)" >> titles.txt; done
          ls -la > listing.txt; exit 0
      - name: Save
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b economy-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Statistics Canada table lookup $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" economy-raw
