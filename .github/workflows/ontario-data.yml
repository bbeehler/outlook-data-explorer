# Keeps the Ontario Vehicles page (ontario/) up to date from Ontario's open "Vehicle population data"
# (Ministry of Transportation). Downloads every file in the dataset, saves the raw files to the `ontario-raw`
# branch, rebuilds ontario/data.json with tools/ontario_build.py and commits it when the numbers change.
# Runs monthly, on demand (Actions tab -> Run workflow), and when this file changes.
name: Ontario vehicle data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ontario-data.yml', 'tools/ontario_build.py']
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every file in the dataset
        run: |
          mkdir -p "$RUNNER_TEMP/raw" && cd "$RUNNER_TEMP/raw"
          curl -fsSL "https://data.ontario.ca/api/3/action/package_show?id=vehicle-population-data" -o package.json
          python3 - <<'PY'
          import json, urllib.request, os, re
          pkg = json.load(open('package.json'))['result']
          for r in pkg['resources']:
              url = r['url']; name = re.sub(r'[^A-Za-z0-9._-]+', '_', r.get('name') or os.path.basename(url))
              ext = os.path.splitext(url.split('?')[0])[1] or '.' + (r.get('format') or 'bin').lower()
              fn = name if name.lower().endswith(ext.lower()) else name + ext
              print('get', fn, url)
              urllib.request.urlretrieve(url, fn)
          PY
          ls -la
      - name: Save raw files to the ontario-raw branch
        run: |
          cd "$RUNNER_TEMP/raw"
          git init -q -b ontario-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Ontario vehicle population data, fetched $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ontario-raw
      - name: Rebuild ontario/data.json and commit if the numbers changed
        run: |
          python3 tools/ontario_build.py "$RUNNER_TEMP/raw" ontario/data.json
          if git diff --quiet -- ontario/data.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add ontario/data.json && git commit -m "Update Ontario vehicle data" && git push
