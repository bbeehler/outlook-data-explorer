<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Outlook Data Explorer | AIA Canada</title>
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: AIA Canada brand frame (dark-blue masthead, red edge bar, square corners), topic rail on the left, figure cards in a single readable column, AI drawer on the right. */
:root {
  --navy: #192b56;
  --red: #e21c47;
  --sky: #84c8e3;
  --bg: #f2f7fa;
  --surface: #ffffff;
  --ink: #192b56;
  --ink-2: #3d4c6e;
  --muted: #5f6b85;
  --line: #d9e3ec;
  --line-soft: #e8eef4;
  --accent: #e21c47;
  --accent-ink: #c4123a;
  --chip: #e6eef5;
  --chip-on: #192b56;
  --chip-on-ink: #ffffff;
  --mast: #192b56;
  --mast-ink: #ffffff;
  --mast-2: #84c8e3;
  --focus: #e21c47;
  --warn-bg: #fff4e0;
  --warn-ink: #7a4b00;
  --s1: #2a78d6; --s2: #e21c47; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #eb6834;
  --muted-bar: #b9c6d6;
  --font: "Sofia Pro", "Sofia Sans", Arial, sans-serif;
  --font-data: "Sofia Sans Semi Condensed", "Sofia Sans", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1630; --surface: #142045; --ink: #eef3f9; --ink-2: #c9d4e4; --muted: #9eadc6; --line: #26365f; --line-soft: #1d2a50;
    --accent: #f2546f; --accent-ink: #ff7d93; --chip: #1f2d55; --chip-on: #84c8e3; --chip-on-ink: #0d1630;
    --mast: #0a1128; --mast-ink: #ffffff; --mast-2: #84c8e3; --focus: #84c8e3; --warn-bg: #3a2c10; --warn-ink: #f5d48f;
    --s1: #3987e5; --s2: #f2546f; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #d95926;
    --muted-bar: #3c4d78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1630; --surface: #142045; --ink: #eef3f9; --ink-2: #c9d4e4; --muted: #9eadc6; --line: #26365f; --line-soft: #1d2a50;
  --accent: #f2546f; --accent-ink: #ff7d93; --chip: #1f2d55; --chip-on: #84c8e3; --chip-on-ink: #0d1630;
  --mast: #0a1128; --mast-ink: #ffffff; --mast-2: #84c8e3; --focus: #84c8e3; --warn-bg: #3a2c10; --warn-ink: #f5d48f;
  --s1: #3987e5; --s2: #f2546f; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #d95926;
  --muted-bar: #3c4d78; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--mast); }
.edge { position: fixed; top: 0; bottom: 0; left: 0; width: 6px; background: var(--red); z-index: 40; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* masthead */
.mast { background: var(--mast); color: var(--mast-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.mast-in { max-width: 1280px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 0; min-width: 0; margin-right: auto; }
.brand .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mast-2); font-weight: 600; }
.brand .name { font-size: 22px; font-weight: 800; line-height: 1.1; }
.search { position: relative; flex: 1 1 280px; max-width: 420px; }
.search input { width: 100%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff; padding: 9px 12px 9px 34px; border-radius: 0; }
.search input::placeholder { color: rgba(255,255,255,.7); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: rgba(255,255,255,.8); fill: none; stroke-width: 2; }
.btn-ask { background: var(--red); color: #fff; border: 0; padding: 10px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; border-radius: 0; }
.btn-ask:hover { filter: brightness(1.08); }
.btn-ask svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

/* frame */
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.rail button { text-align: left; background: none; border: 0; padding: 9px 12px; border-left: 3px solid transparent; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.rail button:hover { background: var(--chip); }
.rail button[aria-current="true"] { border-left-color: var(--accent); color: var(--ink); font-weight: 700; background: var(--surface); }
.rail .count { color: var(--muted); font-size: 12px; font-family: var(--font-data); }
.rail .sep { height: 1px; background: var(--line); margin: 10px 0; }
.rail .small { font-size: 12px; color: var(--muted); padding: 0 12px; }
main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }

.banner { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.banner b { font-weight: 700; }

.topic-head { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.topic-head .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
.topic-head h1 { font-size: 30px; font-weight: 800; line-height: 1.15; }
.topic-head p { margin: 0; color: var(--ink-2); max-width: 68ch; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.kpi { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; }
button.kpi:hover { background: var(--chip); }
.kpi .v { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .s { font-size: 12px; color: var(--muted); font-family: var(--font-data); }

.panel { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 18px; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { border: 1px solid var(--line); background: var(--bg); padding: 8px 12px; text-align: left; font-size: 14px; color: var(--ink); }
.qchip:hover { border-color: var(--accent); }
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tcard { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tcard:hover { border-color: var(--ink); }
.tcard b { font-size: 16px; }
.tcard span { font-size: 13px; color: var(--muted); }

/* figure cards */
.card { background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; scroll-margin-top: 90px; }
.card-h { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 4px; }
.ref { font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.card-h h2 { font-size: 18px; font-weight: 700; line-height: 1.25; }
.insight { font-size: 14px; color: var(--ink-2); }
.insight strong { color: var(--ink); }
.controls { padding: 6px 18px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }
.sel { border: 1px solid var(--line); background: var(--surface); padding: 5px 8px; font-size: 13px; max-width: 100%; }
.legend { padding: 8px 18px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.lg { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 3px 9px; font-size: 12.5px; color: var(--ink); max-width: 100%; }
.lg i { width: 10px; height: 10px; flex: none; border-radius: 2px; }
.lg[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.lg[aria-pressed="false"] i { background: transparent !important; outline: 1px solid var(--muted); }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .hint { font-size: 12px; color: var(--muted); align-self: center; }
.viz { padding: 10px 18px 6px; position: relative; }
.viz .cv { position: relative; height: 320px; }
.viz .cv.tall { height: 520px; }
.viz .cv.xtall { height: 720px; }
.multi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.multi h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.multi .cv { height: 260px; }
.tbl-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; border: 1px solid var(--line-soft); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 160px; }
thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--line); }
thead th button { background: none; border: 0; padding: 0; font-weight: 600; color: inherit; }
tbody tr:hover td { background: var(--bg); }
td .bar { display: inline-block; height: 8px; background: var(--s1); vertical-align: middle; margin-right: 6px; border-radius: 0 2px 2px 0; }
.foot { padding: 8px 18px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: center; border-top: 1px solid var(--line-soft); margin-top: 8px; }
.src { font-size: 12px; color: var(--muted); max-width: 70ch; }
.src em { font-style: normal; color: var(--warn-ink); background: var(--warn-bg); padding: 0 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.act { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.act:hover { border-color: var(--ink); color: var(--ink); }
.act.ai { border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.act svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
.rank { display: flex; flex-direction: column; gap: 6px; }
.rrow { display: grid; grid-template-columns: 26px minmax(0, 190px) minmax(0, 1fr) 84px; gap: 8px; align-items: center; font-size: 13.5px; }
.rrow .rk { color: var(--muted); font-family: var(--font-data); text-align: right; }
.rrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .track { height: 14px; background: var(--line-soft); }
.rrow .fill { height: 14px; background: var(--s1); border-radius: 0 4px 4px 0; }
.rrow .vv { text-align: right; font-variant-numeric: tabular-nums; }
.rrow .mv { font-size: 11px; font-family: var(--font-data); margin-left: 4px; }
.up { color: #1a7f4b; } .dn { color: var(--accent-ink); }
.rnote { font-size: 12px; color: var(--muted); }
.lcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lcard { border: 1px solid var(--line); padding: 12px; }
.lcard b { display: block; margin-bottom: 4px; }
.lcard ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.defs dl { margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.defs dt { font-weight: 700; font-family: var(--font-data); }
.defs dd { margin: 0; color: var(--ink-2); }
.defs h3 { font-size: 15px; margin: 8px 0; }
.tsearch { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; font-size: 13px; width: 220px; max-width: 100%; }
.empty { color: var(--muted); padding: 20px 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; font-size: 14px; z-index: 60; }
.results-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.results-list button { background: var(--surface); border: 0; text-align: left; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.results-list button:hover { background: var(--chip); }
.results-list .ref { font-size: 11.5px; }
.pagefoot { font-size: 12px; color: var(--muted); max-width: 90ch; display: flex; flex-direction: column; gap: 6px; }

/* AI drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -12px 0 40px rgba(10, 20, 45, .18); }
.dr-h { background: var(--mast); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.dr-h b { font-size: 16px; margin-right: auto; }
.dr-h button { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 4px 10px; font-size: 13px; }
.dr-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { font-size: 14.5px; line-height: 1.55; }
.msg.u { align-self: flex-end; background: var(--chip); padding: 8px 12px; max-width: 90%; }
.msg.a { border-left: 3px solid var(--accent); padding-left: 12px; }
.msg.a p { margin: 0 0 8px; } .msg.a ul { margin: 0 0 8px; padding-left: 18px; }
.msg .ctx { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.msg .status { color: var(--muted); font-size: 13px; }
.dr-intro { font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; }
.dr-f { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.dr-f form { display: flex; gap: 8px; }
.dr-f textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; font: inherit; color: var(--ink); min-height: 44px; max-height: 120px; }
.dr-f .send { background: var(--red); color: #fff; border: 0; padding: 0 16px; font-weight: 700; }
.dr-f .fine { font-size: 11.5px; color: var(--muted); }

/* sign-in gate and account bar */
.wrap.gated { grid-template-columns: minmax(0, 1fr); }
.gate { max-width: 560px; margin: 32px auto; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.gate h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
.gate p { margin: 0; color: var(--ink-2); }
.gate .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
.gate-form { display: flex; flex-direction: column; gap: 8px; }
.gate-form label { font-weight: 600; font-size: 14px; }
.gate-form input { border: 1px solid var(--line); background: var(--bg); padding: 11px 12px; font-size: 16px; }
.gate-form .btn-ask { justify-content: center; padding: 12px 16px; }
.gate-err { color: var(--accent-ink); font-weight: 600; }
.gate-muted { font-size: 13px; color: var(--muted) !important; }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.85); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.who button { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 5px 10px; font-size: 13px; }
.bulk { border: 1px solid var(--line); background: var(--bg); padding: 10px; font: inherit; color: var(--ink); width: 100%; resize: vertical; }
.panel td, .panel th { text-align: left; }

@media (max-width: 960px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .rail button { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; background: var(--surface); border: 1px solid var(--line); }
  .rail button[aria-current="true"] { border-bottom: 3px solid var(--accent); }
  .rail .sep, .rail .small, .rail .count { display: none; }
  .topics, .lcards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 24px; }
  .topics, .lcards, .multi { grid-template-columns: minmax(0, 1fr); }
  .topic-head h1 { font-size: 24px; }
  .viz .cv { height: 280px; } .viz .cv.tall { height: 460px; } .viz .cv.xtall { height: 640px; }
  .rrow { grid-template-columns: 22px minmax(0, 1fr) 76px; }
  .rrow .track { grid-column: 2 / 4; grid-row: 2; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .brand .name { font-size: 19px; }
  .defs dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .defs dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="edge" aria-hidden="true"></div>
<header class="mast">
  <div class="mast-in">
    <div class="brand">
      <span class="eyebrow">AIA Canada · Outlook Study 2025</span>
      <span class="name">Outlook Data Explorer</span>
    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find a figure: EV share, technicians, F-150…" autocomplete="off">
    </label>
    <div class="who" id="who" hidden><span id="whoEmail"></span><button type="button" id="signOut">Sign out</button></div>
    <button class="btn-ask" id="askTop" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Ask the data</button>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Topics"></nav>
  <main id="main"></main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Ask the data">
  <div class="dr-h"><b>Ask the data</b><button id="drNew" type="button">New chat</button><button id="drClose" type="button">Close</button></div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-f">
    <form id="drForm">
      <textarea id="drIn" rows="2" placeholder="Ask about vehicles, jobs, EVs, repair demand…"></textarea>
      <button class="send" id="drSend" type="submit">Ask</button>
    </form>
    <span class="fine">Answers come only from the Outlook Study figures in this tool and cite them. Check important numbers in the figure before you quote them.</span>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = window.AIA_EXPLORER_CONFIG;
let DS = [];
let BYID = {};
const TOPICS = [
  { id: 'home', name: 'Overview', blurb: '' },

  if (!toolsOK) {
    const hits = DS.map(d => [d, score(d, text)]).filter(x => x[1] > 0 && x[0] !== ctxDs).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
    lead += `\n\nAll figures available:\n${catalogue()}\n\nData for the figures most related to the question:\n${hits.map(d => textFor(d)).join('\n\n').slice(0, 30000)}`;
  } else lead += '\n\nUse find_figures and get_figure to look up the data before answering. Fetch only what you need.';
  const turns = [{ role: 'user', content: lead }, ...chat.slice(-6), { role: 'user', content: text }];
  const opts = { signal: ctl.signal, onText: ({ text: t }) => { out.innerHTML = md(t); } };
  if (toolsOK) opts.tools = TOOLS.map(t => ({ ...t, execute: (inp) => { out.querySelector('.status') && (out.querySelector('.status').textContent = 'Looking up figures…'); return t.execute(inp || {}); } }));
  else opts.cache = false;
  try {
    const r = await SAMPLE(turns, opts);
    out.innerHTML = md(r.text);
    if (r.truncated) out.append(h('p', { class: 'status' }, 'The answer was cut short. Try a narrower question.'));
    chat.push({ role: 'user', content: text }, { role: 'assistant', content: r.text });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text) out.innerHTML = md(e.text); else out.replaceChildren();
    const msg = {
      cancelled: 'Stopped.', rate_limited: 'Too many questions in a short time. Try again in a few minutes.',
      not_granted: 'Answers need your permission to use Claude. Reopen the page to be asked again.', session_expired: 'Your sign-in has expired. Sign in again, then ask.',
      prompt_too_large: 'That question pulled in too much data. Try something narrower.', refused: 'Claude could not answer that. Try rephrasing.',
      tools_unavailable: 'Something went wrong. Ask again.', upstream_error: 'The connection dropped. Ask again.',
    }[code] || 'Something went wrong. Ask again.';
    out.append(h('p', { class: 'status' }, msg));
    if (code === 'tools_unavailable') toolsOK = false;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { SAMPLE = null; $('#askTop').hidden = true; }
  } finally {
    stop.remove(); busy = false; $('#drSend').disabled = false; ctl = null;
    body.scrollTop = body.scrollHeight;
  }
}
$('#drForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#drIn').value; $('#drIn').value = ''; send(v); });
$('#drIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#drForm').requestSubmit(); } });
$('#drClose').addEventListener('click', () => { $('#drawer').hidden = true; });
$('#drNew').addEventListener('click', () => { if (ctl) ctl.abort(); chat = []; pinned = null; intro(); });
$('#askTop').addEventListener('click', () => openDrawer());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) $('#drawer').hidden = true; });

/* ---------- search, theme, boot ---------- */
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(render, 200); });
const rerender = () => { clearTimeout(rerender.t); rerender.t = setTimeout(render, 60); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- sign-in, data loading and access management (Supabase) ---------- */
const SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
let IS_ADMIN = false, LOADED_FOR = null;
const INITIAL_HASH = (location.hash || '').slice(1);

function gate(kind, info = {}) {
  document.querySelector('.wrap').classList.add('gated');
  $('#rail').hidden = true; $('#askTop').hidden = true; $('.search').hidden = true;
  const main = $('#main');
  for (const c of main.querySelectorAll('canvas')) { const ch = CHARTS.get(c); if (ch) { ch.destroy(); CHARTS.delete(c); } }
  main.replaceChildren();
  const box = h('section', { class: 'gate', 'aria-live': 'polite' });
  if (kind === 'loading') {
    box.append(h('p', { class: 'gate-muted' }, info.msg || 'Loading the Outlook data…'));
  } else if (kind === 'signin') {
    const form = h('form', { class: 'gate-form' },
      h('label', { for: 'email' }, 'Work email'),
      h('input', { id: 'email', type: 'email', required: true, autocomplete: 'email', placeholder: 'name@company.com', value: info.email || '' }),
      h('button', { type: 'submit', class: 'btn-ask' }, 'Email me a sign-in link'));
    const err = h('p', { class: 'gate-err', role: 'alert' }, info.error || '');
    err.hidden = !info.error;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('#email').value.trim().toLowerCase();
      const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Sending…';
      const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) {
        btn.disabled = false; btn.textContent = 'Email me a sign-in link';
        err.hidden = false;
        err.textContent = /rate|security purposes|seconds/i.test(error.message) ? 'A link was sent a moment ago. Wait a minute, then try again.' : 'The link could not be sent. Check the address and try again.';
        return;
      }
      gate('sent', { email });
    });
    box.append(h('span', { class: 'eyebrow' }, 'Members and AIA Canada staff'),
      h('h1', {}, 'Sign in to the Outlook Data Explorer'),
      h('p', {}, 'Enter your work email and we’ll send you a sign-in link. No password needed. Access is limited to approved AIA Canada members and staff.'),
      form, err,
      h('p', { class: 'gate-muted' }, `Need access? Contact ${CFG.contactEmail}.`));
  } else if (kind === 'sent') {
    box.append(h('h1', {}, 'Check your email'),
      h('p', {}, h('span', {}, 'We sent a sign-in link to '), h('strong', {}, info.email), h('span', {}, '. Open it on this device. The link works once and expires after an hour.')),
      h('p', { class: 'gate-muted' }, 'No email after a few minutes? Check your junk folder.'),
      h('button', { type: 'button', class: 'act', onclick: () => gate('signin', { email: info.email }) }, 'Use a different email'));
  } else if (kind === 'denied') {
    box.append(h('h1', {}, 'You’re signed in, but not on the access list yet'),
      h('p', {}, h('span', {}, 'You’re signed in as '), h('strong', {}, info.email), h('span', {}, `. The Outlook data is limited to approved members and staff. Ask ${CFG.contactEmail} to add this address, then sign in again.`)),
      h('button', { type: 'button', class: 'act', onclick: signOut }, 'Sign out'));
  } else if (kind === 'error') {
    box.append(h('h1', {}, 'The data could not be loaded'), h('p', {}, 'Check your connection and reload the page.'),
      h('button', { type: 'button', class: 'act', onclick: () => location.reload() }, 'Reload'));
  }
  main.append(box);
}

async function signOut() { await SB.auth.signOut(); LOADED_FOR = null; IS_ADMIN = false; SAMPLE = null; $('#who').hidden = true; gate('signin'); }
$('#signOut').addEventListener('click', signOut);

async function loadApp(session) {
  if (LOADED_FOR === session.user.id) return;
  LOADED_FOR = session.user.id;
  $('#whoEmail').textContent = session.user.email; $('#who').hidden = false;
  gate('loading');
  const { data, error } = await SB.from('outlook_figures').select('payload').eq('edition', '2025').order('sort');
  if (error) { LOADED_FOR = null; gate('error'); return; }
  if (!data.length) { gate('denied', { email: session.user.email }); return; }
  DS = data.map(r => r.payload);
  BYID = Object.fromEntries(DS.map(d => [d.id, d]));
  const adm = await SB.rpc('outlook_is_admin'); IS_ADMIN = adm.data === true;
  DOWNLOADS = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
    const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); return { status: 'saved' };
  } };
  document.querySelector('.wrap').classList.remove('gated'); $('#rail').hidden = false; $('.search').hidden = false;
  if (TOPICS.some(t => t.id === INITIAL_HASH)) current = INITIAL_HASH;
  render();
  if (BYID[INITIAL_HASH]) jump(INITIAL_HASH);
  try {
    const r = await askFn({ ping: true });
    if (r.ok && (await r.json()).enabled) { SAMPLE = remoteSample(); $('#askTop').hidden = false; render(); }
  } catch {}
}

async function askFn(body, signal) {
  const { data: { session } } = await SB.auth.getSession();
  return fetch(`${CFG.supabaseUrl}/functions/v1/outlook-ask`, {
    method: 'POST', signal,
    headers: { 'content-type': 'application/json', apikey: CFG.supabaseKey, Authorization: `Bearer ${session ? session.access_token : ''}` },
    body: JSON.stringify(body),
  });
}

/* Same shape as the in-Claude sample() so the rest of the page is unchanged */
function remoteSample() {
  const fn = async (turns, opts = {}) => {
    const msgs = [];
    for (const t of (typeof turns === 'string' ? [{ role: 'user', content: turns }] : turns)) {
      const last = msgs[msgs.length - 1];
      if (last && last.role === t.role) last.content += '\n\n' + t.content; else msgs.push({ role: t.role, content: t.content });
    }
    let res;
    try { res = await askFn({ messages: msgs }, opts.signal); }
    catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: String(e) }; }
    if (res.status === 429) throw { code: 'rate_limited', message: 'rate limited' };
    if (res.status === 401) throw { code: 'session_expired', message: 'sign in' };
    if (res.status === 403) throw { code: 'not_granted', message: 'no access' };
    if (res.status === 413) throw { code: 'prompt_too_large', message: 'too large' };
    if (!res.ok) throw { code: 'upstream_error', message: 'HTTP ' + res.status };
    const j = await res.json();
    if (!j.text) throw { code: 'empty_completion', message: 'empty' };
    if (opts.onText) opts.onText({ text: j.text, delta: j.text });
    return { text: j.text, truncated: !!j.truncated, modelTierApplied: 'default' };
  };
  fn.limits = async () => ({ maxPromptBytes: 65536 });
  return fn;
}

/* ---------- access list (admins only) ---------- */
async function renderAccess(main) {
  main.append(h('div', { class: 'topic-head' }, h('span', { class: 'eyebrow' }, 'Admin'), h('h1', {}, 'Manage access'),
    h('p', {}, 'People on this list can sign in with their email and see the Outlook data. Removing someone takes effect the next time they load the page.')));
  const panel = h('section', { class: 'panel' });
  const ta = h('textarea', { id: 'bulk', rows: '4', class: 'bulk', placeholder: 'One or more emails, separated by commas or new lines' });
  const org = h('input', { id: 'bulkOrg', class: 'tsearch', placeholder: 'Organization (optional)' });
  const msg = h('p', { class: 'gate-muted', role: 'status' });
  const add = h('button', { type: 'button', class: 'btn-ask', onclick: async () => {
    const emails = [...new Set(ta.value.toLowerCase().split(/[\s,;]+/).map(s => s.trim()).filter(s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)))];
    if (!emails.length) { msg.textContent = 'Enter at least one valid email address.'; return; }
    add.disabled = true;
    const { error } = await SB.from('outlook_access').upsert(emails.map(email => ({ email, organization: org.value.trim(), source: 'manual' })), { onConflict: 'email', ignoreDuplicates: true });
    add.disabled = false;
    if (error) { msg.textContent = 'Could not add: ' + error.message; return; }
    ta.value = ''; msg.textContent = `Added ${emails.length} ${emails.length === 1 ? 'address' : 'addresses'}. Send them the page link; they sign in with that email.`;
    list();
  } }, 'Add to list');
  panel.append(h('h2', {}, 'Add people by hand'), h('p', { class: 'gate-muted' }, 'For staff, partners or anyone not in Insightly as a member contact.'), ta, h('div', { class: 'chips' }, org, add), msg);
  const listBox = h('section', { class: 'panel' }, h('h2', {}, 'Current list'));
  main.append(panel, listBox);
  const syncBox = h('section', { class: 'panel' });
  main.insertBefore(syncBox, panel);
  async function syncStatus() {
    const { data: runs } = await SB.from('outlook_sync_log').select('started_at, finished_at, ok, member_orgs, member_emails, added, removed, note').order('started_at', { ascending: false }).limit(1);
    const r = runs && runs[0];
    const btn = h('button', { type: 'button', class: 'btn-ask', onclick: async () => {
      btn.disabled = true; btn.textContent = 'Syncing\u2026 (about a minute)';
      try {
        const { data: { session } } = await SB.auth.getSession();
        const res = await fetch(`${CFG.supabaseUrl}/functions/v1/outlook-member-sync`, { method: 'POST', headers: { 'content-type': 'application/json', apikey: CFG.supabaseKey, Authorization: `Bearer ${session.access_token}` }, body: '{}' });
        const j = await res.json().catch(() => ({}));
        toast(j.ok ? `Synced: ${j.member_emails} member contacts, ${j.added} added, ${j.removed} removed.` : (j.error || 'The sync did not finish.'));
      } catch { toast('The sync did not finish. Try again in a few minutes.'); }
      syncStatus(); list();
    } }, 'Sync from Insightly now');
    let line;
    if (!r) line = 'No sync has run yet. Member contacts are added automatically once the Insightly key is set up.';
    else if (!r.finished_at) line = `A sync started ${new Date(r.started_at).toLocaleString('en-CA')} and is still running.`;
    else if (r.ok) line = `Last sync ${new Date(r.finished_at).toLocaleString('en-CA')}: ${r.member_orgs} member organisations, ${r.member_emails} contacts with access (${r.added} added, ${r.removed} removed). ${r.note.includes('skipped') ? r.note : ''}`;
    else line = `Last sync failed ${new Date(r.started_at).toLocaleString('en-CA')}: ${r.note}`;
    syncBox.replaceChildren(h('h2', {}, 'Members from Insightly'),
      h('p', { style: 'margin:0;color:var(--ink-2)' }, 'Every contact at an organisation whose Last Membership Year is this year or later gets access automatically. The list refreshes every night, and people are removed when their organisation\u2019s membership lapses. People you add below stay until you remove them.'),
      h('p', { class: 'gate-muted' }, line), h('div', {}, btn));
  }
  syncStatus();
  let q = '';
  async function list() {
    const { data, error } = await SB.from('outlook_access').select('email, full_name, organization, added_at, source').order('organization').order('email').limit(10000);
    const usage = await SB.from('outlook_ai_log').select('id', { count: 'exact', head: true }).gte('asked_at', new Date(Date.now() - 30 * 864e5).toISOString());
    const nIns = data ? data.filter(r => r.source === 'insightly').length : 0;
    listBox.replaceChildren(h('h2', {}, `Current list (${data ? data.length : 0}: ${nIns} from Insightly, ${data ? data.length - nIns : 0} added by hand)`));
    if (usage.count != null) listBox.append(h('p', { class: 'gate-muted' }, `${usage.count} AI questions asked in the last 30 days.`));
    if (error) { listBox.append(h('p', {}, 'Could not load the list.')); return; }
    const search = h('input', { id: 'accessSearch', type: 'search', class: 'tsearch', placeholder: 'Find a person or company', value: q });
    const body = h('tbody', {});
    const draw = () => {
      const f = q.toLowerCase();
      const rows = data.filter(r => !f || (r.email + ' ' + r.full_name + ' ' + r.organization).toLowerCase().includes(f));
      body.replaceChildren(...rows.slice(0, 200).map(r => {
        let act;
        if (r.source === 'insightly') act = h('span', { class: 'gate-muted', title: 'Managed by the nightly Insightly sync' }, 'From Insightly');
        else {
          act = h('button', { type: 'button', class: 'act', onclick: async () => {
            if (act.dataset.armed !== '1') { act.dataset.armed = '1'; act.textContent = 'Confirm remove'; return; }
            act.disabled = true;
            const { error: e2 } = await SB.from('outlook_access').delete().eq('email', r.email);
            if (e2) { act.disabled = false; toast('Could not remove ' + r.email); } else list();
          } }, 'Remove');
        }
        return h('tr', {}, h('th', { scope: 'row' }, r.email), h('td', {}, r.full_name), h('td', {}, r.organization), h('td', {}, new Date(r.added_at).toLocaleDateString('en-CA')), h('td', {}, act));
      }));
      more.textContent = rows.length > 200 ? `Showing 200 of ${rows.length}. Search to narrow the list.` : '';
    };
    const more = h('p', { class: 'gate-muted' });
    search.addEventListener('input', () => { q = search.value; draw(); });
    listBox.append(search, h('div', { class: 'tbl-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Email', 'Name', 'Organization', 'Added', ''].map(c => h('th', { scope: 'col' }, c)))), body)), more);
    draw();
  }
  list();
}

/* ---------- boot ---------- */
(async function boot() {
  const err = new URLSearchParams(location.hash.slice(1)).get('error_description');
  gate('loading', { msg: 'Checking your sign-in…' });
  SB.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED')) loadApp(session);
    if (event === 'SIGNED_OUT') { LOADED_FOR = null; gate('signin'); }
  });
  const { data: { session } } = await SB.auth.getSession();
  if (session) loadApp(session);
  else gate('signin', { error: err ? 'That sign-in link has expired or was already used. Request a new one.' : '' });
})();
</script>
